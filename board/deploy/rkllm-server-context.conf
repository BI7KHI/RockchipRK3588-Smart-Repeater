# ELF2：明确 rkllm-server 的上下文长度与生成上限。
#
# 装到 /etc/systemd/system/rkllm-server.service.d/context.conf
# （该文件此前是 **0 字节的空文件**，等于什么都没设，一切靠代码默认值。）
#
# 取值依据 —— 全部为板端实测（直接 HTTP 打 8001，不依赖任何猜测）：
#
#   1) 上游 flask_server.py 把 max_context_len 硬编码成 512，prompt 超约 380 token
#      就静默返回空串。deploy/patch_rkllm_context.py 已把它改成读 RKLLM_MAX_CONTEXT。
#      实测本机在 4096 下：4015 字符 24.8s 正常、4615 字符 30.9s 正常、
#      5015 字符起静默空串（HTTP 200 + content='' + 0.3s，调用方零信号）。
#   2) 我们的真实提示词最长约 1000 字符（基础设定 + 工具协议 + 问题 + 播报规范），
#      4096 有充足余量。**不加大**是有意的：rkllm-server 常驻已占
#      Rss 1.81 GB / Pss_Shmem 1.62 GB（DMA 钉住的模型权重）并已换页 479 MB；
#      Qwen2.5-1.5B 只有 12 层、2 个 KV head，KV cache 本身是几十 MB 量级，
#      加大 context 换不来可用性，只会挤内存、加剧换页。
#   3) max_new_tokens 上游写死 -1（不设上限），且请求里的 max_tokens **完全不被采纳**
#      （实测请求 10，实际输出 171 字），生成会一路吃到上下文尽头。封到 512：
#      一条语音回复最多 100 字上下，512 token 足够，同时给出确定的延时上界。
#
# 改完执行：systemctl daemon-reload && systemctl restart rkllm-server
[Service]
Environment=RKLLM_MAX_CONTEXT=4096
Environment=RKLLM_MAX_NEW_TOKENS=512
