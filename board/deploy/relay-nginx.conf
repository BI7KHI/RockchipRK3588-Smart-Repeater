# ELF2 智能中继控制中心 · nginx 反向代理（HTTP 80 → HTTPS 443 → Flask 127.0.0.1:8080）
# 部署：sudo cp relay-nginx.conf /etc/nginx/sites-available/relay
#       sudo ln -sf /etc/nginx/sites-available/relay /etc/nginx/sites-enabled/relay
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl restart nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 局域网探活，不做跳转，方便脚本/摄像头调试
    location = /healthz {
        default_type text/plain;
        return 200 "elf2 relay web ok\n";
    }

    # 其余全部跳转到可信端口 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /www/certs/elf2.crt;
    ssl_certificate_key /www/certs/elf2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ELF2SSL:4m;
    ssl_session_timeout 1h;

    # 音色包 / 训练集 zip 可能几十 MB；与 Flask 的 RELAY_MAX_UPLOAD_MB 保持一致
    client_max_body_size   512m;
    client_body_timeout    600s;
    client_body_buffer_size 1m;

    proxy_connect_timeout  30s;
    proxy_send_timeout     3600s;
    proxy_read_timeout     3600s;
    # 摄像头 MJPEG、麦克风 PCM 流必须关闭响应缓冲
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
